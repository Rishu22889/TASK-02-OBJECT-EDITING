[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-object-editing"
version = "1.0.0"
description = "Text-driven object removal and replacement on CPU"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=11.2",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
vision = ["torch>=2.4", "ultralytics>=8.3", "onnxruntime>=1.18", "timm>=0.9"]
llm = ["llama-cpp-python>=0.3", "huggingface-hub>=0.24"]
diffusion = ["diffusers>=0.32", "transformers>=4.45", "accelerate>=1.0", "peft>=0.13", "safetensors>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
edit-image = "editing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
